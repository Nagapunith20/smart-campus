
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event | SMART CAMPUS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .event-card {
            max-width: 850px;
            margin: 40px auto;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h2 {
            color: #123b68;
            font-weight: bold;
        }

        .form-control, select, textarea {
            margin-bottom: 15px;
        }

        .btn-submit {
            background: #123b68;
            color: white;
            padding: 12px 25px;
        }

        .btn-submit:hover {
            background: #0b294b;
            color: white;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark" style="background:#123b68;">
    <div class="container">
        <span class="navbar-brand">SMART CAMPUS - Faculty Portal</span>
        <a href="{% url 'logout' %}" class="btn btn-light">Logout</a>
    </div>
</nav>

<div class="container">
    <div class="event-card">

        <div class="text-center mb-4">
            <h2>Create New Event</h2>
            <p class="text-muted">
                Submit your college event for admin approval.
            </p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-submit w-100">
                Submit Event for Approval
            </button>
        </form>

    </div>
</div>

</body>
</html>
