
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | SMART CAMPUS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .register-card {
            max-width: 650px;
            margin: 40px auto;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h2 {
            color: #123b68;
            font-weight: bold;
        }

        .btn-register {
            background: #123b68;
            color: white;
            width: 100%;
            padding: 12px;
        }

        .btn-register:hover {
            background: #0b294b;
            color: white;
        }

        input, select {
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="register-card">

        <div class="text-center mb-4">
            <h2>SMART CAMPUS</h2>
            <p class="text-muted">Create Your Student Account</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-register mt-3">
                Create Account
            </button>
        </form>

        <p class="text-center mt-4">
            Already have an account?
            <a href="{% url 'login' %}">Login here</a>
        </p>

    </div>
</div>

</body>
</html>
